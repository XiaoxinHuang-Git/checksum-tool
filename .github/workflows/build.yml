name: Build and Release

on:
  push:
    tags:
      - 'v*'          # 打 v1.0.0 标签时触发发布
    branches:
      - main          # main 分支 push 时只构建不发布
  workflow_dispatch:  # 手动触发

env:
  BINARY_NAME: checksum-tool
  GO_VERSION: '1.21'

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ''
          - os: linux
            arch: arm64
            ext: ''
          - os: windows
            arch: amd64
            ext: '.exe'
          - os: darwin
            arch: amd64
            ext: ''
          - os: darwin
            arch: arm64
            ext: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o dist/${BINARY_NAME}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .
          echo "Binary size: $(du -h dist/${BINARY_NAME}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }})"

      - name: Calculate SHA256
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${BINARY_NAME}-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/
            !dist/SHA256SUMS.txt

      - name: Upload SHA256SUMS
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS.txt

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display structure
        run: ls -R

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            checksum-tool-linux-amd64/*
            checksum-tool-linux-arm64/*
            checksum-tool-windows-amd64/*
            checksum-tool-darwin-amd64/*
            checksum-tool-darwin-arm64/*
            checksums/*
          generate_release_notes: true
          draft: false
          prerelease: false